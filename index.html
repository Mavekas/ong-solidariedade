<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ONG Solidariedade - Projetos sociais, voluntariado e campanhas de doação."
    >

    <title>ONG Solidariedade</title>

    <link rel="stylesheet" href="style.css">

    <script
        type="module"
        src="js/app.js"
    ></script>
</head>

<body>

    <!-- ========================================
         LINK DE ACESSIBILIDADE
    ========================================= -->

    <a
        class="skip-link"
        href="#app"
    >
        Pular para o conteúdo
    </a>


    <!-- ========================================
         CABEÇALHO
    ========================================= -->

    <header class="cabecalho">

        <div class="container cabecalho-container">

            <a
                href="#inicio"
                class="logo"
                aria-label="ONG Solidariedade - Página inicial"
            >
                ONG Solidariedade
            </a>


            <!-- MENU MOBILE -->

            <button
                class="menu-toggle"
                type="button"
                aria-label="Abrir menu de navegação"
                aria-expanded="false"
                aria-controls="menu-principal"
            >
                ☰
            </button>


            <!-- NAVEGAÇÃO PRINCIPAL -->

            <nav
                id="menu-principal"
                class="menu"
                aria-label="Navegação principal"
            >

                <ul class="menu-lista">

                    <li>
                        <a
                            href="#inicio"
                            data-rota="inicio"
                        >
                            Início
                        </a>
                    </li>


                    <li class="dropdown">

                        <a
                            href="#projetos"
                            data-rota="projetos"
                        >
                            Projetos
                        </a>

                        <ul
                            class="submenu"
                            aria-label="Submenu de projetos"
                        >

                            <li>
                                <a href="#projetos">
                                    Voluntariado
                                </a>
                            </li>

                            <li>
                                <a href="#projetos">
                                    Campanhas de doação
                                </a>
                            </li>

                        </ul>

                    </li>


                    <li>
                        <a
                            href="#cadastro"
                            data-rota="cadastro"
                        >
                            Participe
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- ========================================
         CONTEÚDO DINÂMICO DA SPA
    ========================================= -->

    <main
        id="app"
        tabindex="-1"
        aria-live="polite"
        aria-atomic="false"
    >
        <!--
            O conteúdo das rotas será inserido
            dinamicamente pelo JavaScript.

            Rotas:
            #inicio
            #projetos
            #cadastro
        -->
    </main>


    <!-- ========================================
         AVISO SEM JAVASCRIPT
    ========================================= -->

    <noscript>

        <div class="container">

            <div
                class="alerta alerta-aviso"
                role="alert"
            >
                Para utilizar esta aplicação,
                é necessário habilitar o JavaScript
                no navegador.
            </div>

        </div>

    </noscript>


    <!-- ========================================
         RODAPÉ
    ========================================= -->

    <footer class="rodape">

        <div class="container rodape-conteudo">

            <p>
                &copy; 2026 ONG Solidariedade.
                Todos os direitos reservados.
            </p>

            <a href="#cadastro">
                Participe da nossa ONG
            </a>

        </div>

    </footer>

</body>

</html>
